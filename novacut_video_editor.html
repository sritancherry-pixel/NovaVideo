<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>NovaCut Video Editor</title><style>
*{box-sizing:border-box}body{margin:0;background:#090b10;color:#fff;font-family:system-ui,Arial;overflow:hidden}.app{height:100vh;display:flex;flex-direction:column}.top{height:58px;background:#11141c;border-bottom:1px solid #272c38;display:flex;align-items:center;justify-content:space-between;padding:0 14px}.brand{font-weight:900;font-size:20px}.brand i{color:#8064ff;font-style:normal}.btn{border:0;border-radius:11px;padding:10px 14px;background:#1d222d;color:#fff;font-weight:700;cursor:pointer}.primary{background:#8064ff}.main{flex:1;min-height:0;display:flex;flex-direction:column}.preview{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#202538,#080a0e 70%);padding:14px}.preview video{max-width:100%;max-height:100%;border-radius:14px;background:#000}.empty{text-align:center;color:#9ba4b5;border:1px dashed #3b4353;border-radius:18px;padding:35px 25px}.empty strong{display:block;color:#fff;font-size:20px;margin-bottom:7px}.bottom{height:230px;background:#11141b;border-top:1px solid #292e39;padding:10px}.time{display:flex;justify-content:space-between;color:#9ca5b5;font-size:12px}.timeline{height:72px;margin:8px 0;background:#080a0f;border:1px solid #303746;border-radius:11px;position:relative;overflow:hidden}.clip{height:58px;margin:6px;background:linear-gradient(135deg,#394158,#222938);border:1px solid #626c83;border-radius:8px;padding:18px 10px;font-size:11px;color:#e7eaf0}.head{position:absolute;top:0;bottom:0;width:2px;background:#8b6cff;left:0}.tools{display:flex;gap:8px;overflow-x:auto;padding-top:4px}.tool{min-width:66px;text-align:center}.tool button{width:100%;height:43px}.tool small{display:block;color:#aeb5c2;margin-top:4px;font-size:10px}.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:20px}.card{background:#171b24;border:1px solid #333a49;border-radius:17px;padding:20px;width:min(410px,100%)}.card input,.card select{width:100%;margin:8px 0 15px;padding:11px;background:#0b0e14;color:#fff;border:1px solid #343b49;border-radius:9px}.row{display:flex;gap:8px}.row button{flex:1}.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:#222834;padding:10px 15px;border-radius:10px;display:none}
</style></head><body><div class="app"><header class="top"><div class="brand">Nova<i>Cut</i></div><div><label class="btn" for="file">＋ Import</label><input id="file" type="file" accept="video/*" hidden><button id="export" class="btn primary">Export</button></div></header><main class="main"><section class="preview"><div id="empty" class="empty"><strong>Your canvas is empty</strong>Import a video to start editing.</div><video id="video" controls playsinline style="display:none"></video></section><section class="bottom"><div class="time"><span id="now">00:00.0</span><span id="dur">00:00.0</span></div><div class="timeline" id="timeline"><div id="track"></div><div class="head" id="head"></div></div><div class="tools"><div class="tool"><button class="btn" onclick="trim()">✂️</button><small>Trim</small></div><div class="tool"><button class="btn" onclick="split()">⚡</button><small>Split</small></div><div class="tool"><button class="btn" onclick="speed()">1×</button><small>Speed</small></div><div class="tool"><button class="btn" onclick="text()">T</button><small>Text</small></div><div class="tool"><button class="btn" onclick="mute()">🔊</button><small>Volume</small></div><div class="tool"><button class="btn" onclick="rotate()">↻</button><small>Rotate</small></div><div class="tool"><button class="btn" onclick="filter()">◐</button><small>Filter</small></div><div class="tool"><button class="btn" onclick="resetEdit()">↺</button><small>Reset</small></div></div></section></main></div><div id="modal" class="modal"><div id="card" class="card"></div></div><div id="toast" class="toast"></div>
<script>
const $=id=>document.getElementById(id),video=$('video'),modal=$('modal'),card=$('card'),toast=$('toast');let url=null,start=0,end=0,rot=0;
function toastMsg(x){toast.textContent=x;toast.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>toast.style.display='none',1800)}function fmt(s){s=Math.max(0,s||0);return String(Math.floor(s/60)).padStart(2,'0')+':'+(s%60).toFixed(1).padStart(4,'0')}
$('file').onchange=e=>{let f=e.target.files[0];if(!f)return;url=URL.createObjectURL(f);video.src=url;video.style.display='block';$('empty').style.display='none';video.onloadedmetadata=()=>{start=0;end=video.duration;$('dur').textContent=fmt(end);$('track').innerHTML='<div class="clip">'+f.name+'</div>';toastMsg('Video imported')}};
video.ontimeupdate=()=>{$('now').textContent=fmt(video.currentTime);$('head').style.left=Math.min(100,video.currentTime/(video.duration||1)*100)+'%';if(video.currentTime>=end)video.pause()};
$('timeline').onclick=e=>{if(!video.duration)return;let r=e.currentTarget.getBoundingClientRect();video.currentTime=(e.clientX-r.left)/r.width*video.duration};
function open(title,body,apply){card.innerHTML='<h3>'+title+'</h3>'+body+'<div class="row"><button class="btn" onclick="closeM()">Cancel</button><button class="btn primary" id="apply">Apply</button></div>';modal.style.display='flex';$('apply').onclick=()=>{apply();closeM()}}function closeM(){modal.style.display='none'}
function trim(){if(!url)return toastMsg('Import a video first');open('Trim clip','Start <input id="a" type="number" step=".1" value="'+start+'"> End <input id="b" type="number" step=".1" value="'+end+'">',()=>{start=Math.max(0,+$('a').value||0);end=Math.min(video.duration,Math.max(start,+$('b').value||video.duration));video.currentTime=start;toastMsg('Trim applied')})}
function speed(){open('Playback speed','<select id="s"><option>.5</option><option>.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option></select>',()=>{video.playbackRate=+$('s').value;toastMsg('Speed changed')})}
function text(){open('Text overlay','<input id="tx" maxlength="60" placeholder="Type your text">',()=>toastMsg($('tx').value?'Text added':'No text added'))}
function filter(){open('Filter','<select id="f"><option value="none">Original</option><option value="grayscale(1)">Grayscale</option><option value="sepia(.7)">Sepia</option><option value="contrast(1.25)">High contrast</option><option value="brightness(1.18)">Bright</option></select>',()=>{video.style.filter=$('f').value;toastMsg('Filter applied')})}
function split(){if(!url)return toastMsg('Import a video first');if(video.currentTime<=start+.1||video.currentTime>=end-.1)return toastMsg('Place playhead inside the clip');let d=document.createElement('div');d.className='clip';d.textContent='Split • '+fmt(video.currentTime);$('track').appendChild(d);toastMsg('Clip split')}
function mute(){video.muted=!video.muted;toastMsg(video.muted?'Muted':'Audio on')}function rotate(){rot=(rot+90)%360;video.style.transform='rotate('+rot+'deg)';toastMsg('Rotated '+rot+'°')}function resetEdit(){start=0;end=video.duration||0;rot=0;video.style='';video.playbackRate=1;video.muted=false;toastMsg('Edits reset')}
$('export').onclick=()=>toastMsg(url?'Prototype ready — native export can be added next':'Import a video first');
</script></body></html>
